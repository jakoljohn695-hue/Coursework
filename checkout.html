<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reserve ticket</title><link rel="stylesheet" href="/static/style.css"></head><body><nav class="nav"><a class="brand" href="/">← <b>Talanta Tickets</b></a></nav><main class="checkout"><div class="ticket gold"><small>{{ticket.area}}</small><h2>{{ticket.name}}</h2><p>{{ticket.desc}}</p><div class="price">{{currency}} {{'%.2f'|format(unit)}} <small>/ seat</small></div></div><h1>Reserve your tickets</h1><p class="lead">This creates a pending demo order. No payment is taken and no ticket is issued.</p><form method="post"><input type="hidden" name="currency" value="{{currency}}"><label>Full name</label><input name="name" required><label>Email</label><input type="email" name="email" required><label>Phone number</label><input name="phone" placeholder="+254..." required><label>Quantity (1–10)</label><input type="number" name="quantity" min="1" max="10" value="1" required><label>Payment method</label><select name="payment_method"><option value="MPESA">M-Pesa (not connected)</option><option value="PAYPAL">PayPal (not connected)</option></select><button class="cta" type="submit">Create pending reservation</button></form><p><a href="/">← Back to event</a></p></main></body></html>
