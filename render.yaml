services:
  - type: web
    name: talanta-ticket-demo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_KEY
        sync: false
      - key: DATABASE_PATH
        value: /var/data/talanta_tickets.db
    disk:
      name: talanta-data
      mountPath: /var/data
      sizeGB: 1
